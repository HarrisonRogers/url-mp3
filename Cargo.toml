[workspace]
resolver = "2"
members = [
    "crates/url-mp3-core",
    "crates/url-mp3-cli",
    "crates/url-mp3-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Shared dependencies
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Core library deps
yt-dlp = "1.4"
dirs = "5.0"

# CLI deps
colored = "2.1"

# Server deps
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
futures = "0.3"
tokio-stream = "0.1"
